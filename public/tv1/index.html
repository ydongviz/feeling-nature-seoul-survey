<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TV-1 • Live Viz</title>

  <!-- Your existing styles for the viz (copy your CSS here as styles.css) -->
  <link rel="stylesheet" href="./styles.css" />

  <!-- (Optional) CDN helpers if your app expects them -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    /* Small, self-contained overlay style for countdown / notes */
    #kioskOverlay {
      position: fixed; inset: 0; z-index: 9999; display: none;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,.5);
    }
    #kioskOverlay .box {
      background: rgba(20,20,20,.92); color: #fff;
      border: 1px solid #333; border-radius: 12px;
      padding: 18px 22px; min-width: 320px; text-align: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      box-shadow: 0 6px 30px rgba(0,0,0,.35);
    }
    #kioskOverlay .msg { font-size: clamp(18px, 2.2vw, 28px); }
    #kioskOverlay .count { margin-top: 6px; font-size: clamp(22px, 3vw, 44px); display:none; }
  </style>
</head>
<body>
  <!-- Your existing viz builds its own DOM; no fixed markup required here. -->
  <div id="kioskOverlay" aria-live="polite">
    <div class="box">
      <div class="msg" id="kioskMsg">Loading…</div>
      <div class="count" id="kioskCount"></div>
    </div>
  </div>

  <!-- 1) Your big viz/app code (rename your old script4.patched.js -> app.js) -->
  <script src="./app.js"></script>

  <!-- 2) Kiosk adapter + state poller -->
  <script src="./script.js"></script>
</body>
</html>
