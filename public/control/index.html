<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1"
  />
  <title>FN Control Pad</title>
  <style>
    :root { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji; }
    body { margin: 24px; line-height: 1.35; }
    h1 { margin: 0 0 16px; font-size: 18px; }
    fieldset { border: 1px solid #ddd; border-radius: 8px; padding: 12px 12px 8px; margin: 0 0 12px; }
    legend { padding: 0 6px; color: #555; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    label { display: inline-flex; align-items: center; gap: 6px; }
    input[type="text"], input[type="number"] { padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; min-width: 120px; }
    button { padding: 8px 12px; border: 1px solid #222; background: #111; color: #fff; border-radius: 8px; cursor: pointer; }
    button.secondary { background: #fff; color: #111; border-color: #aaa; }
    button:disabled { opacity: .5; cursor: default; }
    .hint { color: #666; font-size: 12px; }
    pre { background: #0b0b0b; color: #eaeaea; padding: 12px; border-radius: 8px; overflow: auto; font-size: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  </style>
</head>
<body>
  <h1>🌿 Feeling Nature — Control Pad</h1>

  <!-- Language -->
  <fieldset>
    <legend>Language</legend>
    <div class="row">
      <label><input type="radio" name="lang" value="en" checked> English</label>
      <label><input type="radio" name="lang" value="ko"> 한국어</label>
    </div>
  </fieldset>

  <!-- Quick States -->
  <fieldset>
    <legend>Quick States</legend>
    <div class="grid">
      <button id="btn-landing" onclick="send({stage:'idle'})">Landing (Idle = Soft Reset)</button>
      <button onclick="send({stage:'in_progress', ttl_seconds:180})">In Progress (Show note)</button>
      <div>
        <div class="row" style="margin-bottom:6px">
          <input id="cdSecs" type="number" min="1" max="10" value="3" aria-label="Countdown seconds">
          <input id="cdMsg" type="text" placeholder="Message (optional)" aria-label="Countdown message">
        </div>
        <div class="row">
          <button onclick="countdown()">Start Countdown</button>
          <span class="hint">e.g., 3 → 2 → 1 overlay on TVs</span>
        </div>
      </div>
      <button onclick="send({stage:'show_result'})">Show Result (no payload)</button>
    </div>
  </fieldset>

  <!-- Maintenance -->
  <fieldset>
    <legend>Maintenance</legend>
    <div class="row">
      <button class="secondary" onclick="peek()">Peek state.json</button>
      <button onclick="send({stage:'idle', force_reload:true, ttl_seconds:60})">Hard Reload TVs (remote)</button>
    </div>
    <div class="hint">Hard Reload sets <code>force_reload:true</code>; TVs will reload once per new ETag.</div>
  </fieldset>

  <!-- Output -->
  <fieldset>
    <legend>Output</legend>
    <pre id="out">Ready.</pre>
  </fieldset>

  <script>
    const outEl = document.getElementById('out');
    const cdSecs = document.getElementById('cdSecs');
    const cdMsg = document.getElementById('cdMsg');
    const btnLanding = document.getElementById('btn-landing');

    function getLang(){
      const sel = document.querySelector('input[name="lang"]:checked');
      return sel ? sel.value : 'en';
    }

    // Debounce helper to prevent double taps
    function brieflyDisable(el, ms=800){
      if (!el) return;
      el.disabled = true; setTimeout(()=>{ el.disabled = false; }, ms);
    }

    async function send(body){
      // Always attach language unless explicitly provided
      if (!('lang' in body)) body.lang = getLang();

      // Give immediate UI feedback
      outEl.textContent = 'Sending…';
      brieflyDisable(event?.target);

      try {
        const r = await fetch('/api/state', {
          method:'POST',
          headers:{ 'content-type':'application/json' /*, 'x-api-key': 'YOUR_KEY'*/ },
          body: JSON.stringify(body)
        });
        const text = await r.text();
        let j; try { j = JSON.parse(text); } catch { j = { raw:text }; }
        outEl.textContent = JSON.stringify({ status:r.status, ok:r.ok, resp:j }, null, 2);
      } catch (err) {
        outEl.textContent = 'Request failed: ' + (err?.message || err);
      }
    }

    function countdown(){
      const secs = Math.max(1, Math.min(10, parseInt(cdSecs.value || '3', 10)));
      const nb = new Date(Date.now() + secs*1000).toISOString();
      send({
        stage:'in_progress',
        overlay:{ type:'countdown', message: (cdMsg.value||'').trim(), countdown_secs: secs, not_before: nb },
        ttl_seconds: 180,
        lang: getLang()
      });
    }



  const STATE_ABS_URL = "https://<your-cloudfront-or-s3-domain>/state/state.json";

  async function peek(){
    outEl.textContent = 'Fetching state…';
      try {
        const r = await fetch(STATE_ABS_URL, { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP '+r.status);
        const j = await r.json();
        const et = r.headers.get('ETag');
        outEl.textContent = JSON.stringify({ etag: et, state: j }, null, 2);
      } catch (e) {
    outEl.textContent = 'State fetch failed: ' + (e?.message || e);
   }
  }
  
  </script>
</body>
</html>
