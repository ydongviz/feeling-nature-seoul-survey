<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TV-2 · Petals → Biome Dots → Video</title>
  <!-- So /tv2 works without /index.html -->
  <base href="/tv2/">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Optional debug HUD: show with ?debug=1 -->
  <div id="volumeDebug" hidden>
    Volume: <span id="volumeValue">1.00</span><br>
    Height (P90): <span id="heightValue">0</span><br>
    Phase: <span id="phaseValue">-</span>
  </div>

  <!-- Background music -->
  <audio id="backgroundMusic" loop preload="auto">
    <source src="music/nature-dreamscape-350256.mp3" type="audio/mpeg" />
    <source src="music/nature-dreamscape-350256.ogg" type="audio/ogg" />
  </audio>

  <!-- Loading veil while OBJ loads -->
  <div id="veil"><div id="percentage">0%</div></div>

  <!-- Fullscreen video layer -->
  <div id="videoContainer">
    <video id="bgVideo" loop playsinline preload="auto" autoplay>
      <!-- update filename/path if yours differs -->
      <source src="img/fn-draft2.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- Three scene -->
  <script type="module" src="script.js"></script>

  <!-- Service worker (bump version in sw.js when you change assets) -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/tv2/sw.js', { scope: '/tv2/' }).catch(()=>{});
    }
  </script>
</body>
</html>
